[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yottaflex"
version = "1.0.0"
description = "Enterprise Reverse Logistics, RMA Governance & Benchmark Engine"
authors = [{ name = "YottaFlex Engineering" }]
requires-python = ">=3.9"
dependencies = []

[tool.ruff]
target-version = "py39"
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
